[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppmark-supplementary"
version = "0.1.0"
description = "Anonymous supplementary code for PP-Mark reproduction."
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pillow>=10.4",
  "pywavelets>=1.6",
  "scipy>=1.11",
  "typer>=0.12",
  "rich>=13.7",
  "reedsolo>=1.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
