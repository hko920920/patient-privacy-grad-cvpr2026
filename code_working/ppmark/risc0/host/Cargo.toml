[package]
name = "zk-genguard-host"
version = "0.1.0"
edition = "2021"

[features]
default = []
cuda = ["risc0-zkvm/cuda"]

[dependencies]
anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.4", features = ["derive"] }
zk-genguard-methods = { path = "../methods" }
risc0-zkvm = { version = "3.0.4", features = ["prove"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
zk-genguard-common = { path = "../common" }
