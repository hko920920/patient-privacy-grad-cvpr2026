[project]
name = "unitdp-algorithm"
version = "0.1.0"
description = "Unit-aligned DP-SGD experiments for windowed sequential learning"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "scikit-learn",
  "torch",
  "opacus==1.6.0",
  "dp-accounting==0.6.0",
]

[project.optional-dependencies]
verification = [
  "jsonschema>=4.18",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
